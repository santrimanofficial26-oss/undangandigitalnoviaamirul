    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020101;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Iframe Fullscreen Responsive */
        #weddingFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
            display: block;
            background-color: #020101;
            z-index: 1;
        }

        /* Elegant Luxury Splash Loader (Maron Black Theme) */
        #splash-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #241D1D 0%, #020101 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
            color: #E3D6D4;
        }

        .loader-monogram {
            font-family: 'Times New Roman', Times, serif, cursive;
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #E3D6D4;
            margin-bottom: 20px;
            text-shadow: 0 4px 15px rgba(160, 122, 126, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        .loader-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(160, 122, 126, 0.2);
            border-top: 3px solid #A07A7E;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        .loader-subtitle {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #B79DA0;
            font-weight: 500;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.85;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.03);
            }
        }
    </style>
</head>

<body>

    <!-- Splash Loader Transisi Mewah -->
    <div id="splash-loader">
        <div class="loader-monogram">N & A</div>
        <div class="loader-spinner"></div>
        <div class="loader-subtitle">The Wedding of Novia & Amirul</div>
    </div>

    <!-- Iframe Embed Google Apps Script Web App -->
    <iframe id="weddingFrame"
        src=""
        allow="autoplay *; camera *; microphone *; geolocation *; clipboard-write *; fullscreen *"
        allowfullscreen="true"
        loading="eager"
        title="Undangan Pernikahan Digital Novia & Amirul">
    </iframe>

    <script>
        (function () {
            // URL Google Apps Script Web App Utama
            const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbyO99Bnmm0Z_WXg6swRtcgDGiB-H9qmBoxsn3iRTah3-mT1wZXMa9M3nb6i3lIamOiptQ/exec";

            // Ambil semua query parameter dari URL Netlify (misal: ?to=Budi+Santoso)
            const currentSearch = window.location.search;
            const urlParams = new URLSearchParams(currentSearch);
            const namaTamu = urlParams.get('to');

            // Jika ada parameter tamu, sesuaikan title browser agar personal
            if (namaTamu) {
                document.title = "Undangan Pernikahan: " + decodeURIComponent(namaTamu) + " | Novia & Amirul";
            }

            // Gabungkan URL GAS dengan parameter yang diteruskan
            let finalIframeSrc = BASE_GAS_URL;
            if (currentSearch && currentSearch.length > 1) {
                // Hilangkan tanda tanya depan jika ada duplikasi
                const cleanQuery = currentSearch.startsWith('?') ? currentSearch.substring(1) : currentSearch;
                finalIframeSrc += (BASE_GAS_URL.includes('?') ? '&' : '?') + cleanQuery;
            }

            const iframe = document.getElementById('weddingFrame');
            const splash = document.getElementById('splash-loader');

            // Set src iframe
            iframe.src = finalIframeSrc;

            // Sembunyikan loader begitu iframe selesai load
            iframe.onload = function () {
                setTimeout(function () {
                    splash.style.opacity = '0';
                    setTimeout(function () {
                        splash.style.visibility = 'hidden';
                    }, 600);
                }, 400);
            };

            // Fallback timeout: Jika jaringan lambat, hilangkan loader maksimal 4 detik
            setTimeout(function () {
                if (splash && splash.style.opacity !== '0') {
                    splash.style.opacity = '0';
                    setTimeout(function () {
                        splash.style.visibility = 'hidden';
                    }, 600);
                }
            }, 4000);
        })();
    </script>
</body>

</html>
